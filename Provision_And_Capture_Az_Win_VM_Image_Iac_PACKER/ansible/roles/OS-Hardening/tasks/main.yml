---
# Security Level Optimization Tasks for Windows VM Images
- name: Registry check - Disallow anonymous enumeration of SAM accounts
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
    name: RestrictAnonymousSAM
    data: 1
    type: dword

- name: Registry check - Enforce TLS 1.3 protocol standards exclusively
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.3\Server
    name: Enabled
    data: 1
    type: dword

- name: Ensure Windows Defender Scheduled Scan policy is activated
  ansible.windows.win_powershell:
    script: |
      Set-MpPreference -DisableRealtimeMonitoring $false -MAPSReporting Advanced